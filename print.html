<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Varemo Kruiswoordraadsel – papieren versie</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root {
    --cell: 6.7mm;
    --ink: #1c1a17;
    --body-ink: #2e2a24;
    --muted: #6b6055;
    --accent: #8c7a5e;
    --line: #c8bfb0;
    --paper: #fff;
    --wash: #faf8f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12mm;
    font-family: 'EB Garamond', Georgia, serif;
    color: var(--ink); background: #f5f2ee;
  }
  .sheet {
    width: 190mm; min-height: 277mm; margin: 0 auto; padding: 9mm;
    background: var(--paper); border: 0.25mm solid var(--line); position: relative;
  }
  .sheet::before, .sheet::after, .corner-bl, .corner-tr {
    content: ''; position: absolute; width: 5mm; height: 5mm;
    border-color: var(--accent); border-style: solid;
  }
  .sheet::before { top: -0.25mm; left: -0.25mm; border-width: 0.6mm 0 0 0.6mm; }
  .sheet::after { right: -0.25mm; bottom: -0.25mm; border-width: 0 0.6mm 0.6mm 0; }
  .corner-bl { left: -0.25mm; bottom: -0.25mm; border-width: 0 0 0.6mm 0.6mm; }
  .corner-tr { right: -0.25mm; top: -0.25mm; border-width: 0.6mm 0.6mm 0 0; }
  header { position: relative; text-align: center; margin-bottom: 3.5mm; min-height: 20mm; }
  .eyebrow {
    margin: 0 0 1mm; color: var(--accent); font-size: 7pt;
    letter-spacing: 0.26em; text-transform: uppercase;
  }
  h1 { margin: 0 0 1mm; font-size: 21pt; font-weight: 500; line-height: 1.15; }
  .subtitle { margin: 0; padding: 0 25mm; color: var(--muted); font-size: 9pt; font-style: italic; }
  .divider { margin: 3mm 0 0; border: 0; border-top: 0.25mm solid var(--line); }
  .qr-link { position: absolute; left: 0; top: -1mm; color: var(--accent); text-decoration: none; font-size: 6.5pt; }
  .qr-link img { display: block; width: 18mm; height: 18mm; margin: 0 auto 0.7mm; image-rendering: pixelated; }
  .grid { display: grid; gap: 0; width: fit-content; margin: 0 auto 4mm; }
  .cell { width: var(--cell); height: var(--cell); position: relative; border: 0.2mm solid var(--accent); }
  .cell.black { background: transparent; border-color: transparent; }
  .clue-num { position: absolute; top: 0.3mm; left: 0.5mm; color: var(--body-ink); font-size: 5pt; line-height: 1; }
  .secret-num { position: absolute; right: 0.35mm; bottom: 0.25mm; color: var(--ink); font-size: 4.5pt; line-height: 1; font-weight: 600; }
  .cell.secret { background: var(--wash); border: 0.6mm solid var(--accent); }
  .clues { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; margin-top: 2mm; }
  h2 {
    margin: 0 0 2mm; padding-bottom: 1mm; border-bottom: 0.25mm solid var(--line);
    color: var(--ink); font-size: 12pt; font-weight: 500;
  }
  ol { margin: 0; padding-left: 7mm; columns: 2; column-gap: 7mm; }
  li { min-height: 6mm; padding: 0 0 1.5mm 1mm; color: var(--body-ink); font-size: 9pt; break-inside: avoid; }
  .answer-line { display: inline-block; width: 23mm; margin-left: 2mm; border-bottom: 0.3mm solid var(--accent); }
  .secret-section {
    margin-top: 4mm; padding: 3mm 4mm 3.5mm; border: 0.25mm solid var(--line);
    background: var(--wash); text-align: center;
  }
  .secret-section::before {
    content: 'DE VERBORGEN BOODSCHAP'; display: block; margin-bottom: 1mm;
    color: var(--accent); font-size: 6.5pt; letter-spacing: 0.2em;
  }
  .secret-section h2 { margin-bottom: 2mm; border: 0; font-size: 12pt; }
  .secret-boxes { display: flex; justify-content: center; gap: 1.4mm; }
  .secret-box { width: 8mm; height: 8mm; border: 0.35mm solid var(--accent); background: #fff; position: relative; }
  .secret-box span { position: absolute; top: 0.3mm; left: 0.5mm; color: var(--accent); font-size: 5pt; }
  .footer {
    margin-top: 3mm; padding-top: 2mm; border-top: 0.25mm solid var(--line);
    text-align: center; color: #a0917e; font-size: 6.5pt;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  @page { size: A4 portrait; margin: 7mm; }
  @media print {
    body { padding: 0; background: #fff; }
    .sheet { width: auto; min-height: 282mm; padding: 7mm; border-color: #aaa; }
    .sheet::before, .sheet::after, .corner-bl, .corner-tr { border-color: #888; }
    .secret-section { background: #f9f9f9; border-color: #aaa; }
  }
  @media screen and (max-width: 800px) {
    body { padding: 8px; overflow-x: auto; }
  }
</style>
</head>
<body>
<main class="sheet">
  <div class="corner-bl"></div>
  <div class="corner-tr"></div>
  <header>
    <a class="qr-link" href="https://dropping-kruiswoord.onrender.com">
      <img src="dropping-kruiswoord-qr.png" alt="QR-code naar de online kruiswoordpuzzel">
      Scan voor opdracht
    </a>
    <p class="eyebrow">Varemo · Muziekopdracht</p>
    <h1>Varemo Kruiswoordraadsel</h1>
    <p class="subtitle">Scan de QR-code om de liedjes te beluisteren. De stervakjes vormen samen een geheim bericht.</p>
    <hr class="divider">
  </header>
  <div class="grid" id="grid"></div>
  <section class="clues">
    <div><h2>Horizontaal</h2><ol id="across"></ol></div>
    <div><h2>Verticaal</h2><ol id="down"></ol></div>
  </section>
  <section class="secret-section">
    <h2>Geheim bericht</h2>
    <div class="secret-boxes" id="secretBoxes"></div>
  </section>
  <p class="footer">★ Schrijf de letters uit de genummerde stervakjes in volgorde over.</p>
</main>
<script>
const CW = {
  rows: 20, cols: 24,
  words: [
    {word:"NIKITA",row:1,col:17,dir:"down",num:1,year:"1985"},
    {word:"BOYS",row:3,col:3,dir:"down",num:2,year:"1987"},
    {word:"GRACELAND",row:3,col:15,dir:"down",num:3,year:"1986"},
    {word:"RELAX",row:5,col:5,dir:"down",num:4,year:"1983"},
    {word:"RESPECTABLE",row:6,col:1,dir:"across",num:5,year:"1987"},
    {word:"AFRICA",row:6,col:8,dir:"down",num:6,year:"1982"},
    {word:"SUCHASHAME",row:6,col:13,dir:"across",num:7,year:"1984"},
    {word:"HOLIDAY",row:8,col:0,dir:"across",num:8,year:"1983"},
    {word:"BILLIEJEAN",row:9,col:7,dir:"across",num:9,year:"1982"},
    {word:"LUKA",row:9,col:10,dir:"down",num:10,year:"1987"},
    {word:"EVERYWHERE",row:9,col:12,dir:"down",num:11,year:"1987"},
    {word:"SHOUT",row:15,col:11,dir:"across",num:12,year:"1984"},
    {word:"IWANTTOBREAKFREE",row:18,col:3,dir:"across",num:13,year:"1984"}
  ],
  secrets: [
    {order:1,row:6,col:13},{order:2,row:5,col:17},{order:3,row:11,col:8},
    {order:4,row:6,col:4},{order:5,row:6,col:18},{order:6,row:6,col:7},
    {order:7,row:7,col:15},{order:8,row:10,col:12},{order:9,row:8,col:3},
    {order:10,row:3,col:15},{order:11,row:15,col:15},{order:12,row:4,col:3},
    {order:13,row:18,col:7},{order:14,row:3,col:17},{order:15,row:9,col:14},
    {order:16,row:5,col:5},{order:17,row:11,col:10}
  ]
};
const answers = Array.from({length:CW.rows},()=>Array(CW.cols).fill(false));
const starts = {};
const secrets = {};
CW.words.forEach(w => {
  starts[`${w.row},${w.col}`] = w.num;
  for (let i=0;i<w.word.length;i++) {
    const r = w.row + (w.dir === 'down' ? i : 0);
    const c = w.col + (w.dir === 'across' ? i : 0);
    answers[r][c] = true;
  }
});
CW.secrets.forEach(s => { secrets[`${s.row},${s.col}`] = s.order; });
const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${CW.cols}, var(--cell))`;
for (let r=0;r<CW.rows;r++) for (let c=0;c<CW.cols;c++) {
  const cell = document.createElement('div');
  cell.className = answers[r][c] ? 'cell' : 'cell black';
  const key = `${r},${c}`;
  if (answers[r][c] && starts[key]) {
    const n = document.createElement('span'); n.className='clue-num'; n.textContent=starts[key]; cell.appendChild(n);
  }
  if (answers[r][c] && secrets[key]) {
    cell.classList.add('secret');
    const n = document.createElement('span'); n.className='secret-num'; n.textContent=`★${secrets[key]}`; cell.appendChild(n);
  }
  grid.appendChild(cell);
}
function addClues(direction,id) {
  CW.words.filter(w=>w.dir===direction).sort((a,b)=>a.num-b.num).forEach(w=>{
    const li=document.createElement('li'); li.value=w.num;
    li.innerHTML=`${w.year}<span class="answer-line"></span>`;
    document.getElementById(id).appendChild(li);
  });
}
addClues('across','across'); addClues('down','down');
for(let i=1;i<=17;i++) {
  const box=document.createElement('div'); box.className='secret-box'; box.innerHTML=`<span>${i}</span>`;
  document.getElementById('secretBoxes').appendChild(box);
}
</script>
</body>
</html>
